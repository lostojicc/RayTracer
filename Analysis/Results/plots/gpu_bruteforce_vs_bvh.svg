<line x1="780.0" y1="90" x2="780.0" y2="450" stroke="#eee"/>
<text x="780.0" y="468" font-size="10" text-anchor="middle">1.00e+04</text>
<line x1="90" y1="450.0" x2="780" y2="450.0" stroke="#eee"/>
<text x="82" y="453.0" font-size="10" text-anchor="end">0.0100</text>
<line x1="90" y1="360.0" x2="780" y2="360.0" stroke="#eee"/>
