<line x1="90" y1="180.0" x2="780" y2="180.0" stroke="#eee"/>
<text x="82" y="183.0" font-size="10" text-anchor="end">10.00</text>
<line x1="90" y1="90.0" x2="780" y2="90.0" stroke="#eee"/>
<text x="82" y="93.0" font-size="10" text-anchor="end">100</text>
<text x="435.0" y="502" font-size="12" text-anchor="middle">Triangle count (N, log scale)</text>
<text x="18" y="270.0" font-size="12" text-anchor="middle" transform="rotate(-90 18 270.0)">Mean GPU render time per frame (ms, log scale)</text>
<polyline points="90.0,342.6 435.0,252.9 780.0,150.8" fill="none" stroke="#1f77b4" stroke-width="2"/>
