<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="820" height="520" fill="white"/>
<text x="410.0" y="28" font-size="17" text-anchor="middle" font-weight="bold">GPU Render Time vs Triangle Count (BruteForce vs BVH, completed configurations only)</text>
<text x="410.0" y="48" font-size="11" text-anchor="middle" fill="#555">GPU, mean of 10 measured frames (320x240, 1 spp, max_path_depth=50), 3 warm-up frames discarded. Only scenes where GPU BruteForce completed (triangle_count &lt;= 20000 ceiling) are shown here.</text>
