<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="820" height="520" fill="white"/>
<text x="410.0" y="28" font-size="17" text-anchor="middle" font-weight="bold">CPU Speedup (BruteForce mean / BVH mean) vs Triangle Count</text>
<text x="410.0" y="48" font-size="11" text-anchor="middle" fill="#555">Speedup = brute-force mean / BVH mean, both measured on the same ray set. Log x, linear y.</text>
<rect x="90" y="90" width="690" height="360" fill="none" stroke="#333" stroke-width="1"/>
<line x1="90.0" y1="90" x2="90.0" y2="450" stroke="#eee"/>
<text x="90.0" y="468" font-size="10" text-anchor="middle">100</text>
<line x1="262.5" y1="90" x2="262.5" y2="450" stroke="#eee"/>
<text x="262.5" y="468" font-size="10" text-anchor="middle">1.00e+03</text>
<line x1="435.0" y1="90" x2="435.0" y2="450" stroke="#eee"/>
<text x="435.0" y="468" font-size="10" text-anchor="middle">1.00e+04</text>
<line x1="607.5" y1="90" x2="607.5" y2="450" stroke="#eee"/>
<text x="607.5" y="468" font-size="10" text-anchor="middle">1.00e+05</text>
<line x1="780.0" y1="90" x2="780.0" y2="450" stroke="#eee"/>
<text x="780.0" y="468" font-size="10" text-anchor="middle">1.00e+06</text>
<line x1="90" y1="450.0" x2="780" y2="450.0" stroke="#eee"/>
<text x="82" y="453.0" font-size="10" text-anchor="end">0</text>
<line x1="90" y1="379.9" x2="780" y2="379.9" stroke="#eee"/>
<text x="82" y="382.9" font-size="10" text-anchor="end">1.00e+03</text>
<line x1="90" y1="309.8" x2="780" y2="309.8" stroke="#eee"/>
<text x="82" y="312.8" font-size="10" text-anchor="end">2.00e+03</text>
<line x1="90" y1="239.7" x2="780" y2="239.7" stroke="#eee"/>
<text x="82" y="242.7" font-size="10" text-anchor="end">3.00e+03</text>
<line x1="90" y1="169.6" x2="780" y2="169.6" stroke="#eee"/>
<text x="82" y="172.6" font-size="10" text-anchor="end">4.00e+03</text>
<line x1="90" y1="99.5" x2="780" y2="99.5" stroke="#eee"/>
<text x="82" y="102.5" font-size="10" text-anchor="end">5.00e+03</text>
<text x="435.0" y="502" font-size="12" text-anchor="middle">Triangle count (N, log scale)</text>
<text x="18" y="270.0" font-size="12" text-anchor="middle" transform="rotate(-90 18 270.0)">Speedup ratio (x, unitless)</text>
<polyline points="90.0,449.6 262.5,448.7 435.0,444.1 580.4,337.5 607.5,434.7 664.0,128.5" fill="none" stroke="#2ca02c" stroke-width="2"/>
<rect x="86.0" y="445.6" width="8" height="8" fill="#2ca02c"/>
<rect x="258.5" y="444.7" width="8" height="8" fill="#2ca02c"/>
<rect x="431.0" y="440.1" width="8" height="8" fill="#2ca02c"/>
<rect x="576.4" y="333.5" width="8" height="8" fill="#2ca02c"/>
<rect x="603.5" y="430.7" width="8" height="8" fill="#2ca02c"/>
<rect x="660.0" y="124.5" width="8" height="8" fill="#2ca02c"/>
<rect x="100" y="96" width="12" height="4" fill="#2ca02c"/>
<text x="118" y="102" font-size="11">Measured CPU speedup</text>
</svg>