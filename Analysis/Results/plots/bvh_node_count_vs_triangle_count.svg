<text x="410.0" y="48" font-size="11" text-anchor="middle" fill="#555">Dashed line: theoretical node count if every leaf held exactly leaf_size=4 triangles (2*ceil(N/4)-1) -- theoretical, not measured. Median-split leaves are frequently smaller than 4, so the measured node count is consistently higher.</text>
