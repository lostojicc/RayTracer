<text x="450.0" y="48" font-size="11" text-anchor="middle" fill="#555">Derived from measured one-time overhead (BVH build+serialize + 3 GPU upload times) and measured single-frame BVH render time, assuming that many frames are rendered from the same static upload (specs/gpu-integration.md 'GPU Data Lifecycle'). Not a new measurement.</text>
